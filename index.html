<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main-wrapper">
        <h1 class="main-title">Customer Management</h1>

        <div class="dashboard-container">
            <!-- Left Side: Form Card -->
            <div class="glass-card form-section">
                <h2>Add Customer</h2>
                <div class="input-group">
                    <input type="text" placeholder="ID" id="txtID">
                    <input type="text" placeholder="Name" id="txtName">
                    <input type="text" placeholder="Address" id="txtAddress">
                    <div class="row-inputs">
                        <input type="text" placeholder="Age" id="txtAge">
                        <input type="text" placeholder="Salary" id="txtSalary">
                    </div>
                    <input type="button" value="Add Customer" class="btn-add" onclick="addCustomer()">
                </div>
            </div>

            <!-- Right Side: Table Card -->
            <div class="glass-card table-section">
                <h2>Customer List</h2>
                <div class="table-wrapper">
                    <table id="tblCustomer">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Age</th>
                            <th>Address</th>
                            <th>Salary</th>
                        </tr>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
